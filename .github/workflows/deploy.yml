name: Deploy Codium-IDE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/codium
            
            git stash
            git fetch origin
            git reset --hard origin/main

            git stash pop

            cd /home/ubuntu/codium/project
            pnpm install --frozen-lockfile
            pnpm build

            cd /home/ubuntu/codium/server
            pnpm install --frozen-lockfile

            cd /home/ubuntu/codium/server/Docker
            docker build -t ide-image:latest .

            pm2 restart 7 8
